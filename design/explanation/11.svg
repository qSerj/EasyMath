и, внутри x + число</text><text x="82" y="232" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1534" xml:space="preserve">1</text><text x="144.0625" y="232" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1535" xml:space="preserve"><tspan fill="#1D2F40" id="object-1656">10 − </tspan><tspan fill="#1D2F40" id="object-1657">(</tspan><tspan fill="#1D2F40" id="object-1658">x</tspan><tspan fill="#1D2F40" id="object-1659"> + 2)</tspan></text><text x="330" y="232" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1536" xml:space="preserve">=</text><text x="354" y="232" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1537" xml:space="preserve">3</text><text x="510" y="229" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1538" xml:space="preserve" data-role="paragraph">Исходное уравнение.</text><text x="82" y="314" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1539" xml:space="preserve">2</text><text x="164.3515625" y="314" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1540" xml:space="preserve"><tspan fill="#1D2F40" id="object-1592">10 </tspan><tspan fill="#1D2F40" id="object-1593">− x </tspan><tspan fill="#1D2F40" id="object-1594">− 2</tspan></text><text x="330" y="314" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1541" xml:space="preserve">=</text><text x="354" y="314" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1542" xml:space="preserve">3</text><text x="510" y="311" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1543" xml:space="preserve" data-role="paragraph" word-spacing="6.6630859375">Убираем скобки. Перед x появляется</text><text x="510" y="335" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1544" xml:space="preserve" data-role="paragraph">минус, +2 меняется на −2.</text><text x="82" y="396" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1545" xml:space="preserve">3</text><text x="164.3515625" y="396" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1546" xml:space="preserve"><tspan fill="#1D2F40" id="object-1601">10 </tspan><tspan fill="#1D2F40" id="object-1602">− 2</tspan><tspan fill="#1D2F40" id="object-1603"> − x</tspan></text><text x="330" y="396" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1547" xml:space="preserve">=</text><text x="354" y="396" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1548" xml:space="preserve">3</text><text x="510" y="393" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1549" xml:space="preserve" data-role="paragraph" word-spacing="4.484375">Переставляем −2 внутри левой части</text><text x="510" y="417" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1550" xml:space="preserve" data-role="paragraph">вместе с минусом.</text><text x="82" y="478" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1551" xml:space="preserve">4</text><text x="235.75390625" y="478" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1552" xml:space="preserve"><tspan fill="#1D2F40" id="object-1605">8</tspan><tspan fill="#1D2F40" id="object-1606"> − x</tspan></text><text x="330" y="478" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1553" xml:space="preserve">=</text><text x="354" y="478" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1554" xml:space="preserve">3</text><text x="510" y="475" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1555" xml:space="preserve" data-role="paragraph">Считаем: 10 − 2 = 8.</text><text x="82" y="560" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1556" xml:space="preserve">5</text><text x="182.05078125" y="560" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1557" xml:space="preserve"><tspan fill="#1D2F40" id="object-1617">8 </tspan><tspan fill="#1D2F40" id="object-1618">− x </tspan><tspan fill="#1D2F40" id="object-1619">+ x</tspan></text><text x="330" y="560" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1558" xml:space="preserve">=</text><text x="354" y="560" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1559" xml:space="preserve"><tspan fill="#1D2F40" id="object-1613">3 </tspan><tspan fill="#1D2F40" id="object-1614">+ x</tspan></text><text x="510" y="557" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1560" xml:space="preserve" data-role="paragraph" word-spacing="15.58984375">Прибавляем x к обеим частям. x</text><text x="510" y="581" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1561" xml:space="preserve" data-role="paragraph" word-spacing="0.3002232142857143">обозначает одно и то же число слева и</text><text x="510" y="605" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1562" xml:space="preserve" data-role="paragraph">справа.</text><text x="82" y="650" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1563" xml:space="preserve">6</text><text x="289.45703125" y="650" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1564" xml:space="preserve">8</text><text x="330" y="650" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1565" xml:space="preserve">=</text><text x="354" y="650" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1566" xml:space="preserve"><tspan fill="#1D2F40" id="object-1623">3</tspan><tspan fill="#1D2F40" id="object-1624"> + x</tspan></text><text x="510" y="647" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1567" xml:space="preserve" data-role="paragraph">Слева −x + x дают ноль.</text><text x="82" y="732" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1568" xml:space="preserve">7</text><text x="234.59765625" y="732" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1569" xml:space="preserve"><tspan fill="#1D2F40" id="object-1630">8 </tspan><tspan fill="#1D2F40" id="object-1631">− 3</tspan></text><text x="330" y="732" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1570" xml:space="preserve">=</text><text x="354" y="732" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1571" xml:space="preserve">x</text><text x="510" y="729" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1572" xml:space="preserve" data-role="paragraph" w