1D2F40" id="object-1688" xml:space="preserve" data-role="paragraph" word-spacing="6.6630859375">Убираем скобки. Перед x появляется</text><text x="510" y="335" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1689" xml:space="preserve" data-role="paragraph">минус, −2 меняется на +2.</text><text x="82" y="396" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1690" xml:space="preserve">3</text><text x="164.3515625" y="396" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1691" xml:space="preserve"><tspan fill="#1D2F40" id="object-1744">10 </tspan><tspan fill="#1D2F40" id="object-1745">+ 2</tspan><tspan fill="#1D2F40" id="object-1746"> − x</tspan></text><text x="330" y="396" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1692" xml:space="preserve">=</text><text x="354" y="396" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1693" xml:space="preserve">7</text><text x="510" y="393" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1694" xml:space="preserve" data-role="paragraph" word-spacing="4.484375">Переставляем +2 внутри левой части</text><text x="510" y="417" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1695" xml:space="preserve" data-role="paragraph">вместе с плюсом.</text><text x="82" y="478" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1696" xml:space="preserve">4</text><text x="219.2109375" y="478" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1697" xml:space="preserve"><tspan fill="#1D2F40" id="object-1748">12</tspan><tspan fill="#1D2F40" id="object-1749"> − x</tspan></text><text x="330" y="478" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1698" xml:space="preserve">=</text><text x="354" y="478" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1699" xml:space="preserve">7</text><text x="510" y="475" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1700" xml:space="preserve" data-role="paragraph">Считаем: 10 + 2 = 12.</text><text x="82" y="560" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1701" xml:space="preserve">5</text><text x="165.5078125" y="560" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1702" xml:space="preserve"><tspan fill="#1D2F40" id="object-1760">12 </tspan><tspan fill="#1D2F40" id="object-1761">− x </tspan><tspan fill="#1D2F40" id="object-1762">+ x</tspan></text><text x="330" y="560" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1703" xml:space="preserve">=</text><text x="354" y="560" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1704" xml:space="preserve"><tspan fill="#1D2F40" id="object-1756">7 </tspan><tspan fill="#1D2F40" id="object-1757">+ x</tspan></text><text x="510" y="557" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-1705" xml:space="preserve" data-role="paragraph">Прибавляем x к обеим частям.</text><text x="82" y="642" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-1706" xml:space="preserve">6</text><text x="272.9140625" y="642" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-1707" xml:space="preserve">12</text><text x="33