<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" width="210mm" height="297mm" viewBox="0 0 1000 1414" version="1.1"><title id="object-486">Скобки и знаки</title><desc id="object-487">Редактируемый разбор. Текст, рамки, стрелки и цветовые выделения — отдельные объекты.</desc><defs id="object-488"><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 7,3.5 L 0,7 Z" fill="#98A8B1" id="object-490"/></marker><marker id="arrow-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 7,3.5 L 0,7 Z" fill="#A23D38" id="object-492"/></marker></defs><rect x="0" y="0" width="1000" height="1414" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" id="object-493"/><text x="500" y="52" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#607D8C" text-anchor="middle" id="object-494" xml:space="preserve">РАЗБОР УРАВНЕНИЙ / 05</text><text x="500" y="100" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#1D2F40" text-anchor="middle" id="object-495" xml:space="preserve">Скобки и знаки</text><line x1="55" y1="129" x2="945" y2="129" stroke="#D1D8DC" stroke-width="1.1" id="object-496"/><text x="500" y="1382" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#62717B" text-anchor="middle" id="object-497" xml:space="preserve">5</text><g id="object-498" inkscape:groupmode="layer" inkscape:label="Раскрываем скобки"><rect x="55" y="154" width="890" height="513" rx="10" fill="#FAFBFC" stroke="#D1D8DC" stroke-width="1.2" id="object-499"/><text x="500" y="191" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#1D2F40" text-anchor="middle" id="object-500" xml:space="preserve">Раскрываем скобки</text><text x="500.0" y="224" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#1D2F40" text-anchor="middle" id="object-501" xml:space="preserve" data-role="paragraph">Перед скобками плюс — убираем скобки, знаки внутри оставляем.</text><text x="150" y="277" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-502" xml:space="preserve">x + (4 − 2)</text><line x1="465" y1="269" x2="535" y2="269" stroke="#98A8B1" stroke-width="1.1" marker-end="url(#arrow-blue)" id="object-503"/><text x="600" y="277" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-504" xml:space="preserve">x + 4 − 2</text><text x="150" y="328" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-505" xml:space="preserve">9 + (5 − 3)</text><line x1="465" y1="320" x2="535" y2="320" stroke="#98A8B1" stroke-width="1.1" marker-end="url(#arrow-blue)" id="object-506"/><text x="600" y="328" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-507" xml:space="preserve">9 + 5 − 3</text><text x="500.0" y="388" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#1D2F40" text-anchor="middle" id="object-508" xml:space="preserve" data-role="paragraph">Перед скобками минус — убираем скобки, каждый знак внутри меняем.</text><text x="80" y="423" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-509" xml:space="preserve" data-role="paragraph" word-spacing="7.950639204545454">Если перед первым числом внутри скобок знак не написан, это +. При</text><text x="500.0" y="449.0" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" text-anchor="middle" id="object-510" xml:space="preserve" data-role="paragraph">раскрытии скобок он тоже меняется на −.</text><text x="80" y="498" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#62717B" id="object-511" xml:space="preserve">Плюс внутри</text><text x="145" y="540" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-512" xml:space="preserve">x − (</text><rect x="204.84765625" y="516" width="24.54296875" height="34" rx="4" fill="none" stroke="#98A8B1" stroke-width="1" stroke-dasharray="4 4" id="object-513"/><text x="208.84765625" y="540" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-514" xml:space="preserve">4</text><text x="225.390625" y="540" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-515" xml:space="preserve"> </text><rect x="229.65625" y="516" width="29.78515625" height="34" rx="4" fill="none" stroke="#98A8B1" stroke-width="1" stroke-dasharray="4 4" id="object-516"/><text x="233.65625" y="540" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-517" xml:space="preserve">+</text><text x="255.44140625" y="540" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-518" xml:space="preserve"> 2)</text><text x="600" y="540" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-519" xml:space="preserve">x </text><rect x="619.65234375" y="516" width="29.78515625" height="34" rx="4" fill="none" stroke="#98A8B1" stroke-width="1" stroke-dasharray="4 4" id="object-520"/><text x="623.65234375" y="540" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-521" xml:space="preserve">−</text><text x="645.4375" y="540" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-522" xml:space="preserve"> 4 </text><rect x="674.51171875" y="516" width="29.78515625" height="34" rx="4" fill="none" stroke="#98A8B1" stroke-width="1" stroke-dasharray="4 4" id="object-523"/><text x="678.51171875" y="540" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-524" xml:space="preserve">−</text><text x="700.296875" y="540" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-525" xml:space="preserve"> 2</text><path d="M 217.84765625,511 C 283.84765625,450 558.65234375,450 632.65234375,511" fill="none" stroke="#98A8B1" stroke-width="1" marker-end="url(#arrow-blue)" id="object-526"/><path d="M 242.65625,511 C 308.65625,475 613.51171875,475 687.51171875,511" fill="none" stroke="#98A8B1" stroke-width="1" marker-end="url(#arrow-blue)" id="object-527"/><text x="80" y="588" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#62717B" id="object-528" xml:space="preserve">Минус внутри</text><text x="145" y="630" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-529" xml:space="preserve">x − (</text><rect x="204.84765625" y="606" width="24.54296875" height="34" rx="4" fill="none" stroke="#98A8B1" stroke-width="1" stroke-dasharray="4 4" id="object-530"/><text x="208.84765625" y="630" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-531" xml:space="preserve">4</text><text x="225.390625" y="630" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-532" xml:space="preserve"> </text><rect x="229.65625" y="606" width="29.78515625" height="34" rx="4" fill="none" stroke="#98A8B1" stroke-width="1" stroke-dasharray="4 4" id="object-533"/><text x="233.65625" y="630" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-534" xml:space="preserve">−</text><text x="255.44140625" y="630" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-535" xml:space="preserve"> 2)</text><text x="600" y="630" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-536" xml:space="preserve">x </text><rect x="619.65234375" y="606" width="29.78515625" height="34" rx="4" fill="none" stroke="#98A8B1" stroke-width="1" stroke-dasharray="4 4" id="object-537"/><text x="623.65234375" y="630" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-538" xml:space="preserve">−</text><text x="645.4375" y="630" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-539" xml:space="preserve"> 4 </text><rect x="674.51171875" y="606" width="29.78515625" height="34" rx="4" fill="none" stroke="#98A8B1" stroke-width="1" stroke-dasharray="4 4" id="object-540"/><text x="678.51171875" y="630" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-541" xml:space="preserve">+</text><text x="700.296875" y="630" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-542" xml:space="preserve"> 2</text><path d="M 217.84765625,601 C 283.84765625,540 558.65234375,540 632.65234375,601" fill="none" stroke="#98A8B1" stroke-width="1" marker-end="url(#arrow-blue)" id="object-543"/><path d="M 242.65625,601 C 308.65625,565 613.51171875,565 687.51171875,601" fill="none" stroke="#98A8B1" stroke-width="1" marker-end="url(#arrow-blue)" id="object-544"/></g><g id="object-545" inkscape:groupmode="layer" inkscape:label="Знак перемещается вместе с числом"><rect x="55" y="690" width="890" height="646" rx="10" fill="#FAFBFC" stroke="#D1D8DC" stroke-width="1.2" id="object-546"/><text x="500" y="727" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#1D2F40" text-anchor="middle" id="object-547" xml:space="preserve">Знак перемещается вместе с числом</text><text x="500.0" y="758" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#1D2F40" text-anchor="middle" id="object-548" xml:space="preserve" data-role="paragraph">Работаем внутри одной части уравнения — левой или правой.</text><text x="80" y="803" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-549" xml:space="preserve" data-role="paragraph" word-spacing="9.376065340909092">Тут и далее, если дети еще не знают отрицательных чисел, то пусть</text><text x="80" y="830" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-550" xml:space="preserve" data-role="paragraph" word-spacing="3.83046875">запомнят, что знак числа всегда ходит с числом. Если переставляем число</text><text x="80" y="857" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-551" xml:space="preserve" data-role="paragraph" word-spacing="1.0660511363636365">перед которым стоит минус, то минус перемещается вместе с числом. Если у</text><text x="80" y="884" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-552" xml:space="preserve" data-role="paragraph" word-spacing="4.653409090909091">числа знак плюс и оно оказывается первым, то плюс, обычно не пишется,</text><text x="80" y="911" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-553" xml:space="preserve" data-role="paragraph" word-spacing="0.24973958333333332">хотя написать его — не ошибка, но так не принято. Если у числа знак минус и</text><text x="80" y="938" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" id="object-554" xml:space="preserve" data-role="paragraph" word-spacing="2.2573784722222223">оно оказывается первым, в выражении, ничего страшного, значит будет так</text><text x="500.0" y="965" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1D2F40" text-anchor="middle" id="object-555" xml:space="preserve" data-role="paragraph">— число со знаком минус.</text><text x="500" y="1084" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#62717B" text-anchor="middle" id="object-556" xml:space="preserve">Одна часть уравнения</text><text x="220" y="1136" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-557" xml:space="preserve">x </text><rect x="239.65234375" y="1112" width="46.328125" height="34" rx="4" fill="none" stroke="#98A8B1" stroke-width="1" stroke-dasharray="4 4" id="object-558"/><text x="243.65234375" y="1136" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-559" xml:space="preserve">−3</text><text x="281.98046875" y="1136" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-560" xml:space="preserve"> + 5</text><line x1="450" y1="1128" x2="520" y2="1128" stroke="#98A8B1" stroke-width="1.1" marker-end="url(#arrow-blue)" id="object-561"/><text x="570" y="1136" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-562" xml:space="preserve">x + 5 </text><rect x="644.51171875" y="1112" width="46.328125" height="34" rx="4" fill="none" stroke="#98A8B1" stroke-width="1" stroke-dasharray="4 4" id="object-563"/><text x="648.51171875" y="1136" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-564" xml:space="preserve">−3</text><text x="220" y="1203" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-565" xml:space="preserve">x − 3 </text><rect x="294.51171875" y="1179" width="46.328125" height="34" rx="4" fill="none" stroke="#98A8B1" stroke-width="1" stroke-dasharray="4 4" id="object-566"/><text x="298.51171875" y="1203" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-567" xml:space="preserve">+5</text><line x1="450" y1="1195" x2="520" y2="1195" stroke="#98A8B1" stroke-width="1.1" marker-end="url(#arrow-blue)" id="object-568"/><rect x="566" y="1179" width="24.54296875" height="34" rx="4" fill="none" stroke="#98A8B1" stroke-width="1" stroke-dasharray="4 4" id="object-569"/><text x="570" y="1203" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-570" xml:space="preserve">5</text><text x="586.54296875" y="1203" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-571" xml:space="preserve"> + x − 3</text><text x="220" y="1270" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-572" xml:space="preserve">x </text><rect x="239.65234375" y="1246" width="46.328125" height="34" rx="4" fill="none" stroke="#98A8B1" stroke-width="1" stroke-dasharray="4 4" id="object-573"/><text x="243.65234375" y="1270" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-574" xml:space="preserve">−3</text><text x="281.98046875" y="1270" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-575" xml:space="preserve"> + 5</text><line x1="450" y1="1262" x2="520" y2="1262" stroke="#98A8B1" stroke-width="1.1" marker-end="url(#arrow-blue)" id="object-576"/><rect x="566" y="1246" width="46.328125" height="34" rx="4" fill="none" stroke="#98A8B1" stroke-width="1" stroke-dasharray="4 4" id="object-577"/><text x="570" y="1270" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-578" xml:space="preserve">−3</text><text x="608.328125" y="1270" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" id="object-579" xml:space="preserve"> + x + 5</text></g></svg>