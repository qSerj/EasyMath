       id="text1">ПАМЯТКА ДЛЯ РОДИТЕЛЕЙ / БЛОК 1</text>
    <text
       x="131.11299"
       y="101.11497"
       font-size="34px"
       font-family="'DejaVu Sans', sans-serif"
       font-weight="700"
       fill="#1d2f40"
       id="text2">От обычного примера — к уравнению</text>
    <text
       x="57"
       y="143"
       font-size="19"
       font-family="DejaVu Sans, sans-serif"
       font-weight="400"
       fill="#596E7E"
       id="text3">Покажем ребёнку, почему привычная запись вычислений здесь уже не подходит.</text>
