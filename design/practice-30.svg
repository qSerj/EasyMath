<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" width="210mm" height="297mm" viewBox="0 0 1000 1414" version="1.1"><title id="object-332">30 тренировочных уравнений</title><sodipodi:namedview id="view" inkscape:document-units="mm"><inkscape:page x="0" y="0" width="1000" height="1414" id="page-1" inkscape:label="1"/></sodipodi:namedview><g transform="translate(0,0)" id="object-333" inkscape:groupmode="layer" inkscape:label="Страница 1"><defs id="p1-object-265"><marker id="p1-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 7,3.5 L 0,7 Z" fill="#98A8B1" id="p1-object-267"/></marker></defs><rect x="0" y="0" width="1000" height="1414" rx="10" fill="#FFFFFF" stroke="none" stroke-width="1.2" id="p1-object-268"/><text x="500" y="52" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#607D8C" text-anchor="middle" id="p1-object-269" xml:space="preserve">ТРЕНИРОВКА / 30 ЗАДАНИЙ</text><text x="500" y="100" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#1D2F40" text-anchor="middle" id="p1-object-270" xml:space="preserve">Реши уравнения</text><text x="500" y="136" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#62717B" text-anchor="middle" id="p1-object-271" xml:space="preserve">Проверь ответ подстановкой в исходное уравнение.</text><text x="155" y="190" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-272" xml:space="preserve">01.</text><text x="225" y="190" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-273" xml:space="preserve">x + 3 = 8</text><text x="155" y="228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-274" xml:space="preserve">02.</text><text x="225" y="228" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-275" xml:space="preserve">x − 4 = 3</text><text x="155" y="266" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-276" xml:space="preserve">03.</text><text x="225" y="266" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-277" xml:space="preserve">9 = x + 3</text><text x="155" y="304" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-278" xml:space="preserve">04.</text><text x="225" y="304" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-279" xml:space="preserve">2 = x − 6</text><text x="155" y="342" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-280" xml:space="preserve">05.</text><text x="225" y="342" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-281" xml:space="preserve">x + 2 + 3 = 9</text><text x="155" y="380" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-282" xml:space="preserve">06.</text><text x="225" y="380" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-283" xml:space="preserve">x + (4 + 2) = 9</text><text x="155" y="418" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-284" xml:space="preserve">07.</text><text x="225" y="418" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-285" xml:space="preserve">x + (7 − 3) = 10</text><text x="155" y="456" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-286" xml:space="preserve">08.</text><text x="225" y="456" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-287" xml:space="preserve">3 + (x + 2) = 10</text><text x="155" y="494" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-288" xml:space="preserve">09.</text><text x="225" y="494" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-289" xml:space="preserve">4 + (x − 3) = 9</text><text x="155" y="532" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-290" xml:space="preserve">10.</text><text x="225" y="532" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-291" xml:space="preserve">12 = 2 + (x + 1)</text><text x="155" y="570" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-292" xml:space="preserve">11.</text><text x="225" y="570" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-293" xml:space="preserve">x − (3 + 2) = 4</text><text x="155" y="608" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-294" xml:space="preserve">12.</text><text x="225" y="608" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-295" xml:space="preserve">x − (7 − 2) = 3</text><text x="155" y="646" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-296" xml:space="preserve">13.</text><text x="225" y="646" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-297" xml:space="preserve">x + 9 − (4 + 1) = 10</text><text x="155" y="684" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-298" xml:space="preserve">14.</text><text x="225" y="684" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-299" xml:space="preserve">x + 3 − (6 − 2) = 4</text><text x="155" y="722" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-300" xml:space="preserve">15.</text><text x="225" y="722" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-301" xml:space="preserve">6 = x − (5 − 3)</text><text x="155" y="760" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-302" xml:space="preserve">16.</text><text x="225" y="760" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-303" xml:space="preserve">x + 18 + 3 − 18 = 7</text><text x="155" y="798" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-304" xml:space="preserve">17.</text><text x="225" y="798" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-305" xml:space="preserve">23 + x − 7 − 23 = 2</text><text x="155" y="836" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-306" xml:space="preserve">18.</text><text x="225" y="836" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-307" xml:space="preserve">x − 12 + 4 + 12 = 10</text><text x="155" y="874" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-308" xml:space="preserve">19.</text><text x="225" y="874" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-309" xml:space="preserve">x + 25 − 3 − 25 + 2 = 6</text><text x="155" y="912" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-310" xml:space="preserve">20.</text><text x="225" y="912" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-311" xml:space="preserve">14 + x + 6 + 4 − 14 − 10 = 5</text><text x="155" y="950" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-312" xml:space="preserve">21.</text><text x="225" y="950" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-313" xml:space="preserve">x + 12 = 3 + 12</text><text x="155" y="988" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-314" xml:space="preserve">22.</text><text x="225" y="988" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-315" xml:space="preserve">x − 7 = 10 − 7</text><text x="155" y="1026" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-316" xml:space="preserve">23.</text><text x="225" y="1026" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-317" xml:space="preserve">15 + x = 15 + 6</text><text x="155" y="1064" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-318" xml:space="preserve">24.</text><text x="225" y="1064" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-319" xml:space="preserve">x + 8 + 2 = 5 + 8</text><text x="155" y="1102" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-320" xml:space="preserve">25.</text><text x="225" y="1102" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-321" xml:space="preserve">x − (6 − 2) + 9 = 7 + 9</text><text x="155" y="1140" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-322" xml:space="preserve">26.</text><text x="225" y="1140" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-323" xml:space="preserve">x + 8 − (3 − 2) = 11</text><text x="155" y="1178" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-324" xml:space="preserve">27.</text><text x="225" y="1178" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-325" xml:space="preserve">16 − (x + 3) = 7</text><text x="155" y="1216" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-326" xml:space="preserve">28.</text><text x="225" y="1216" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-327" xml:space="preserve">12 − (x − 2) = 5</text><text x="155" y="1254" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-328" xml:space="preserve">29.</text><text x="225" y="1254" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-329" xml:space="preserve">18 = 20 − (x + 1)</text><text x="155" y="1292" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#62717B" text-anchor="start" id="p1-object-330" xml:space="preserve">30.</text><text x="225" y="1292" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#1D2F40" text-anchor="start" id="p1-object-331" xml:space="preserve">x + 13 − (5 − 3) + 2 + 6 − 13 − 8 = 5</text></g></svg>